[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sb90-deploy"
dynamic = ["version"]
description = "Shared release bundling, install/upgrade and Hive-integration flows for System-B90 app deployments."
readme = "README.md"
# Ubuntu 22.04's stock python3. bootstrap.py (shipped in every bundle) itself
# only needs 3.6 and builds the .venv this package is installed into.
requires-python = ">=3.10"
authors = [{ name = "Michael K. Steinberg", email = "m.kuper.steinberg@gmail.com" }]
license = { text = "Proprietary" }
dependencies = [
    # From the org index (PyPI stops at 2.1.1). 3.0.0 is the first release
    # supporting Python 3.10 — Ubuntu 22.04's stock python3.
    "PyHiveLMS>=3.0.0",
    "cryptography>=42.0.0",
    # The org's prompt library; prompts.py falls back to input() off a TTY.
    "InquirerPy>=0.3.4",
]

[project.optional-dependencies]
# Release bundling only (CI): uv resolves wheels per target platform/Python.
bundle = ["uv>=0.5.0"]
dev = ["pytest>=8.0.0"]
lint = ["ruff==0.16.8", "vermin==1.6.0", "pre-commit>=4.0.0"]

[project.scripts]
sb90-deploy = "sb90_deploy.cli:main"

[project.urls]
Repository = "https://github.com/System-B90/deploy-py"

[tool.hatch.build.targets.wheel]
packages = ["sb90_deploy"]

[tool.hatch.version]
path = "sb90_deploy/__init__.py"
