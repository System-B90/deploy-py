name: Publish

on:
    push:
        tags: ["v*"]

jobs:
    publish:
        name: Build and Publish sb90-deploy
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Build distributions
              run: |
                  python -m pip install --upgrade pip build
                  python -m build .

            # This repo is private; the .github repo is public and needs no
            # source or auth to install from — mirrors Bluz's publish-cli-index.
            - name: Checkout .github index repo
              uses: actions/checkout@v7
              with:
                  repository: System-B90/.github
                  token: ${{ secrets.CLASSIC_ACCESS_TOKEN }}
                  path: org-github

            - name: Copy distributions and regenerate index
              run: |
                  mkdir -p org-github/pypi/sb90-deploy
                  cp dist/* org-github/pypi/sb90-deploy/
                  python org-github/pypi/generate_index.py sb90-deploy

            - name: Commit and push index update
              working-directory: org-github
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add pypi/
                  git diff --cached --quiet && exit 0
                  git commit -m "Vibe-Updated pip index for sb90-deploy ${{ github.ref_name }}"
                  git push
